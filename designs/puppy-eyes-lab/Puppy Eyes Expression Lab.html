<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Puppy 参数化表情实验室</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0a0d0f;
      --panel: #11171a;
      --panel-2: #171e22;
      --line: #29343a;
      --text: #edf7f7;
      --muted: #8da0a5;
      --cyan: #6bf4ef;
      --cyan-soft: rgba(107, 244, 239, .14);
      --orange: #ef7a31;
    }

    * { box-sizing: border-box; }

    html { background: var(--bg); }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px),
        var(--bg);
      background-size: 32px 32px;
      color: var(--text);
      font-family: -apple-system, "SF Pro Text", "PingFang SC", "Noto Sans SC", sans-serif;
      letter-spacing: 0;
    }

    button, input { font: inherit; }

    .app {
      width: min(1480px, calc(100% - 40px));
      margin: 0 auto;
      padding: 28px 0 48px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 22px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border: 1px solid #405056;
      background: #151c20;
      color: var(--orange);
      font-weight: 800;
      font-size: 18px;
    }

    .brand h1 {
      margin: 0;
      font-size: 20px;
      line-height: 1.2;
      font-weight: 700;
    }

    .brand p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #b7c8cb;
      font-size: 12px;
      white-space: nowrap;
    }

    .status::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 12px var(--cyan);
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(340px, 470px) minmax(0, 1fr);
      gap: 18px;
      align-items: start;
    }

    .preview-panel,
    .library-panel {
      border: 1px solid var(--line);
      background: rgba(17, 23, 26, .94);
    }

    .preview-panel {
      position: sticky;
      top: 18px;
      padding: 20px;
    }

    .section-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 16px;
    }

    .eyebrow {
      color: var(--orange);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .section-head h2 {
      margin: 5px 0 0;
      font-size: 18px;
      line-height: 1.25;
    }

    .expression-code {
      color: var(--cyan);
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 11px;
      padding: 5px 7px;
      border: 1px solid #305056;
      background: #0c1618;
    }

    .screen-shell {
      width: min(100%, 400px);
      aspect-ratio: 1;
      margin: 0 auto 20px;
      padding: 14px;
      border-radius: 50%;
      border: 1px solid #39464b;
      background: #1b2225;
      box-shadow: inset 0 0 0 5px #0d1113, 0 20px 54px rgba(0,0,0,.35);
    }

    .screen-shell canvas {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #020405;
    }

    .description {
      min-height: 48px;
      margin: 0 0 18px;
      color: #b8c5c8;
      font-size: 13px;
      line-height: 1.7;
    }

    .controls {
      display: grid;
      gap: 13px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
    }

    .control-row {
      display: grid;
      grid-template-columns: 92px minmax(0, 1fr) 36px;
      gap: 12px;
      align-items: center;
    }

    .control-row label {
      color: #a8b7ba;
      font-size: 12px;
    }

    .control-row output {
      color: var(--cyan);
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 11px;
      text-align: right;
    }

    input[type="range"] {
      width: 100%;
      height: 3px;
      appearance: none;
      background: #354248;
      border-radius: 0;
    }

    input[type="range"]::-webkit-slider-thumb {
      width: 14px;
      height: 14px;
      appearance: none;
      border-radius: 50%;
      border: 2px solid #0c1113;
      background: var(--cyan);
      box-shadow: 0 0 0 1px var(--cyan);
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .toggle-row span {
      color: #a8b7ba;
      font-size: 12px;
    }

    .toggle {
      width: 42px;
      height: 23px;
      padding: 2px;
      border: 1px solid #405057;
      background: #20292d;
      cursor: pointer;
    }

    .toggle i {
      display: block;
      width: 17px;
      height: 17px;
      background: #66777d;
      transition: transform 160ms ease, background 160ms ease;
    }

    .toggle.active i {
      transform: translateX(17px);
      background: var(--cyan);
    }

    .parameter-divider {
      padding-top: 12px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 11px;
    }

    .export-button {
      min-height: 38px;
      border: 1px solid var(--cyan);
      background: var(--cyan-soft);
      color: var(--cyan);
      cursor: pointer;
      font-weight: 700;
    }

    .library-panel { padding: 20px; }

    .library-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 16px;
    }

    .library-head h2 {
      margin: 5px 0 0;
      font-size: 18px;
    }

    .library-head p {
      margin: 0;
      color: var(--muted);
      font-size: 11px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .expression-card {
      display: grid;
      grid-template-rows: auto auto;
      gap: 10px;
      min-width: 0;
      padding: 10px;
      border: 1px solid #28343a;
      background: #0e1417;
      color: inherit;
      text-align: left;
      cursor: pointer;
      transition: border-color 150ms ease, background 150ms ease, transform 150ms ease;
    }

    .expression-card:hover {
      transform: translateY(-2px);
      border-color: #476067;
      background: #131b1e;
    }

    .expression-card.active {
      border-color: var(--cyan);
      background: var(--cyan-soft);
      box-shadow: inset 0 0 0 1px rgba(107,244,239,.22);
    }

    .expression-card canvas {
      display: block;
      width: 100%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: #020405;
    }

    .card-meta {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      min-width: 0;
    }

    .card-meta strong {
      overflow: hidden;
      font-size: 12px;
      font-weight: 650;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .card-meta span {
      color: #70858b;
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 8px;
      white-space: nowrap;
    }

    @media (max-width: 1100px) {
      .workspace { grid-template-columns: 370px minmax(0, 1fr); }
      .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }

    @media (max-width: 820px) {
      .app { width: min(100% - 24px, 680px); padding-top: 18px; }
      .topbar { align-items: flex-start; }
      .status { display: none; }
      .workspace { grid-template-columns: 1fr; }
      .preview-panel { position: static; }
      .screen-shell { max-width: 350px; }
      .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }

    @media (max-width: 520px) {
      .app { width: min(100% - 16px, 440px); }
      .preview-panel, .library-panel { padding: 14px; }
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
      .library-head { align-items: flex-start; flex-direction: column; gap: 6px; }
      .control-row { grid-template-columns: 76px minmax(0, 1fr) 32px; gap: 8px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .expression-card, .toggle i { transition: none; }
    }
  </style>
</head>
<body>
  <main class="app" data-screen-label="Puppy Eyes Expression Lab">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">P</div>
        <div>
          <h1>Puppy 参数化表情实验室</h1>
          <p>Vector-style solid eyes · 240 × 240 圆屏概念验证</p>
        </div>
      </div>
      <div class="status">实时渲染运行中</div>
    </header>

    <div class="workspace">
      <section class="preview-panel">
        <div class="section-head">
          <div>
            <div class="eyebrow">Live preview</div>
            <h2 id="preview-name">平静</h2>
          </div>
          <code class="expression-code" id="preview-code">neutral</code>
        </div>

        <div class="screen-shell">
          <canvas id="main-canvas" width="480" height="480" aria-label="表情大预览"></canvas>
        </div>

        <p class="description" id="preview-description"></p>

        <div class="controls">
          <div class="control-row">
            <label for="energy">动作强度</label>
            <input id="energy" type="range" min="20" max="100" value="86">
            <output id="energy-value">86</output>
          </div>
          <div class="control-row">
            <label for="blink-rate">眨眼频率</label>
            <input id="blink-rate" type="range" min="0" max="100" value="62">
            <output id="blink-value">62</output>
          </div>
          <div class="toggle-row">
            <span>自动注视与微动作</span>
            <button class="toggle active" id="auto-gaze" type="button" aria-pressed="true" aria-label="自动注视与微动作"><i></i></button>
          </div>
          <div class="parameter-divider">当前表情固件参数</div>
          <div class="control-row">
            <label for="eye-width">眼睛宽度</label>
            <input id="eye-width" data-firmware-key="width" type="range" min="30" max="70" step="1">
            <output id="eye-width-value"></output>
          </div>
          <div class="control-row">
            <label for="eye-height">眼睛高度</label>
            <input id="eye-height" data-firmware-key="height" type="range" min="10" max="105" step="1">
            <output id="eye-height-value"></output>
          </div>
          <div class="control-row">
            <label for="eye-gap">眼距</label>
            <input id="eye-gap" data-firmware-key="gap" type="range" min="8" max="40" step="1">
            <output id="eye-gap-value"></output>
          </div>
          <div class="control-row">
            <label for="eye-tilt">倾斜</label>
            <input id="eye-tilt" data-firmware-key="tilt" type="range" min="-0.4" max="0.4" step="0.01">
            <output id="eye-tilt-value"></output>
          </div>
          <div class="control-row">
            <label for="eye-asymmetry">不对称</label>
            <input id="eye-asymmetry" data-firmware-key="asymmetry" type="range" min="-0.4" max="0.4" step="0.01">
            <output id="eye-asymmetry-value"></output>
          </div>
          <button class="export-button" id="export-firmware" type="button">导出固件参数 .inc</button>
        </div>
      </section>

      <section class="library-panel">
        <div class="library-head">
          <div>
            <div class="eyebrow">Expression library</div>
            <h2>常驻表情 · 21</h2>
          </div>
          <p>点击任一表情查看完整动态</p>
        </div>
        <div class="grid" id="expression-grid"></div>
      </section>
    </div>
  </main>

  <script>
    const expressions = [
      { id: "neutral", name: "平静", desc: "自然睁眼，偶尔扫视和轻眨。它不是静止画面，而是所有状态之间的呼吸基线。", eyeH: .72, eyeW: .92, brow: 0, tilt: 0, pupil: .92 },
      { id: "happy", name: "开心", desc: "下眼睑上提形成笑眼，眼睛略微靠近，并用连续轻眨强化亲近感。", eyeH: .48, eyeW: .98, brow: -.08, tilt: 0, pupil: 1.02, smile: .58 },
      { id: "laughing", name: "大笑", desc: "眼睛压成明显弧线，伴随有节奏的上下弹动，适合作为短促高强度反馈。", eyeH: .24, eyeW: 1.02, brow: -.14, tilt: 0, pupil: .8, smile: .92, bounce: .9 },
      { id: "loving", name: "喜欢", desc: "眼睛放大、眼距缩短，短暂心形粒子只作为强调，不长期占屏。", eyeH: .76, eyeW: .94, brow: -.05, tilt: 0, pupil: 1.38, hearts: true },
      { id: "angry", name: "生气", desc: "眼睛内侧上沿下压、整体变窄并向中心聚焦。情绪完全由紧绷的眼睛轮廓表达。", eyeH: .48, eyeW: .9, brow: .62, tilt: .22, pupil: .78, shake: .35 },
      { id: "sad", name: "难过", desc: "眼睛内侧上沿抬起、视线略微下垂，并配合缓慢眨眼。", eyeH: .62, eyeW: .9, brow: -.62, tilt: -.17, pupil: .85, gazeY: .28 },
      { id: "crying", name: "哭泣", desc: "沿用难过眼型，加入少量泪滴事件。泪滴是状态特效，不改变基础眼睛结构。", eyeH: .58, eyeW: .9, brow: -.68, tilt: -.18, pupil: .82, gazeY: .28, tears: true },
      { id: "confused", name: "困惑", desc: "两只眼睛的高度、上沿角度和位置轻微不对称，形成正在迟疑确认的感觉。", eyeH: .68, eyeW: .9, brow: 0, tilt: 0, pupil: .88, asym: .22, wander: .7 },
      { id: "cool", name: "酷", desc: "上眼睑压低，视线稳定且移动幅度很小。强调从容，而不是愤怒。", eyeH: .43, eyeW: 1.0, brow: .16, tilt: .05, pupil: .72, gazeX: .18 },
      { id: "shocked", name: "震惊", desc: "眼睛突然拉高并迅速缩窄，保持短暂停顿后再缓慢恢复。", eyeH: 1.12, eyeW: .82, brow: -.1, tilt: 0, pupil: .48, pulse: .55 },
      { id: "surprised", name: "惊喜", desc: "与震惊相似但眼型更圆、更开放，并加入轻微上扬动作，情绪偏正向。", eyeH: 1.04, eyeW: .9, brow: -.2, tilt: 0, pupil: 1.14, bounce: .36 },
      { id: "sleepy", name: "困倦", desc: "上眼睑持续下压、视线缓慢漂移，偶尔出现很长的闭眼周期。", eyeH: .3, eyeW: 1.02, brow: .04, tilt: -.03, pupil: .7, gazeY: .18, sleepy: true },
      { id: "winking", name: "眨眼", desc: "单眼闭合，另一只眼睛保持注视。适合作为确认、打招呼或轻松回应。", eyeH: .72, eyeW: .94, brow: -.05, tilt: 0, pupil: .94, wink: true },
      { id: "silly", name: "调皮", desc: "两眼错位并反向偏移，通过快速切换制造不稳定的恶作剧感。", eyeH: .7, eyeW: .92, brow: 0, tilt: .08, pupil: .92, goofy: true, asym: .12 },
      { id: "relaxed", name: "放松", desc: "眼睛半闭，视线移动范围很小，眨眼平缓，适合作为安静陪伴状态。", eyeH: .4, eyeW: 1.02, brow: -.04, tilt: 0, pupil: .82, calm: true },
      { id: "thinking", name: "思考", desc: "视线向上侧移动并出现短暂停顿，两眼保持轻微不对称，避免机械地循环左右看。", eyeH: .62, eyeW: .92, brow: .02, tilt: 0, pupil: .82, gazeX: .36, gazeY: -.34, asym: .1 },
      { id: "listen", name: "倾听", desc: "双眼同步朝声音方向聚焦，轮廓有节奏地收紧再弹开，外侧声波持续扩散，明确表示正在收音。", eyeH: .68, eyeW: 1.02, brow: -.04, tilt: 0, pupil: 1.05, attentive: true },
      { id: "confident", name: "自信", desc: "外侧略抬、眼睑收紧，视线平稳。与酷不同，它保留更多开放和积极感。", eyeH: .55, eyeW: 1.0, brow: .1, tilt: -.08, pupil: .88, gazeX: .08 },
      { id: "embarrassed", name: "害羞", desc: "视线向侧下方回避，眼睛略缩小，并用低饱和腮红光点作为短暂辅助。", eyeH: .58, eyeW: .88, brow: -.16, tilt: 0, pupil: .88, gazeX: -.34, gazeY: .22, blush: true },
      { id: "kiss", name: "亲亲", desc: "双眼柔和收窄，中心出现一次轻量唇形脉冲。保持简洁，不转成完整卡通脸。", eyeH: .35, eyeW: .92, brow: -.08, tilt: 0, pupil: .9, kiss: true },
      { id: "delicious", name: "美味", desc: "眼睛满足地闭合后回弹，配合短暂亮点和轻摆，适合完成任务或收到奖励。", eyeH: .36, eyeW: .98, brow: -.12, tilt: 0, pupil: .9, sparkle: true, bounce: .28 }

    const firmwareSpecs = {

      delicious: { width: 58, height: 30, gap: 30, tilt: 0, asymmetry: 0 }

    const expressionMotion = {
      neutral: { speed: 1.2, x: .6, y: 2.2, tilt: .018, width: .018, height: .028 },
      happy: { speed: 3.8, x: .8, y: 4.2, tilt: .042, width: .055, height: .03 },

      relaxed: { speed: .95, x: .7, y: 2.4, tilt: .018, width: .015, height: .035 },
      thinking: { speed: 2.15, x: 4.5, y: 3.8, tilt: .07, width: .04, height: .06 },
      listen: { speed: 1.6, x: 0, y: .8, tilt: .015, width: .035, height: .10 },
      confident: { speed: 2.2, x: 2.4, y: 2.3, tilt: .04, width: .035, height: .04 },
      embarrassed: { speed: 2.0, x: 3.1, y: 4.1, tilt: .05, width: .03, height: .055 },
      kiss: { speed: 3.1, x: 1.5, y: 3.1, tilt: .035, width: .055, height: .035 },
      delicious: { speed: 4.2, x: 2.2, y: 4.6, tilt: .06, width: .07, height: .08 }
    };

    const eyeCorners = {
      neutral: { top: .25, bottom: .25 },
      happy: { top: .16, bottom: .56 },
      laughing: { top: .12, bottom: .68 },
      loving: { top: .42, bottom: .50 },
      angry: { top: .10, bottom: .28 },
      sad: { top: .28, bottom: .58 },
      crying: { top: .28, bottom: .60 },
      confused: { top: .22, bottom: .42 },
      cool: { top: .16, bottom: .16 },
      shocked: { top: .50, bottom: .50 },
      surprised: { top: .42, bottom: .48 },
      sleepy: { top: .50, bottom: .50 },
      winking: { top: .36, bottom: .52 },
      silly: { top: .42, bottom: .58 },
      relaxed: { top: .42, bottom: .62 },
      thinking: { top: .28, bottom: .50 },
      listen: { top: .22, bottom: .46 },
      confident: { top: .12, bottom: .26 },
      embarrassed: { top: .42, bottom: .56 },
      kiss: { top: .44, bottom: .64 },
      delicious: { top: .16, bottom: .64 }
    };

    const state = {
      selected: "neutral",
      energy: 86,
      blinkRate: 62,
      autoGaze: true,
      nextBlink: performance.now() + 1400,
      blinkStart: 0,
      gazeTargetX: 0,
      gazeTargetY: 0,
      nextGaze: performance.now() + 900,
      expressionStart: performance.now()
    };

    const grid = document.getElementById("expression-grid");
    const mainCanvas = document.getElementById("main-canvas");
    const cardCanvases = new Map();
    const firmwareInputs = [...document.querySelectorAll("[data-firmware-key]")];

    expressions.forEach((expression, index) => {
      const button = document.createElement("button");
      button.className = "expression-card" + (index === 0 ? " active" : "");
      button.type = "button";
      button.dataset.expression = expression.id;
      button.innerHTML = `<canvas width="240" height="240" aria-label="${expression.name}"></canvas><div class="card-meta"><strong>${expression.name}</strong><span>${expression.id}</span></div>`;
      button.addEventListener("click", () => selectExpression(expression.id));
      grid.appendChild(button);
      cardCanvases.set(expression.id, button.querySelector("canvas"));
    });

    function selectExpression(id) {
      state.selected = id;
      const expression = expressions.find(item => item.id === id);
      document.getElementById("preview-name").textContent = expression.name;
      document.getElementById("preview-code").textContent = expression.id;
      document.getElementById("preview-description").textContent = expression.desc;
      document.querySelectorAll(".expression-card").forEach(card => card.classList.toggle("active", card.dataset.expression === id));
      state.nextBlink = performance.now() + 500;
      state.expressionStart = performance.now();
      updateFirmwareControls();
    }

    function updateFirmwareControls() {
      const spec = firmwareSpecs[state.selected];
      firmwareInputs.forEach(input => {
        const value = spec[input.dataset.firmwareKey];
        input.value = value;
        document.getElementById(`${input.id}-value`).textContent = value;
      });
    }

    function drawEyeShape(ctx, x, y, w, h, index, expression, s) {
      const corners = eyeCorners[expression.id];
      const limit = Math.min(w, h) * .5;
      const topRadius = Math.min(limit, limit * corners.top * 2);
      const bottomRadius = Math.min(limit, limit * corners.bottom * 2);
      ctx.fillStyle = "#6bf4ef";

      ctx.beginPath();
      ctx.moveTo(x + topRadius, y);
      ctx.lineTo(x + w - topRadius, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + topRadius);
      ctx.lineTo(x + w, y + h - bottomRadius);
      ctx.quadraticCurveTo(x + w, y + h, x + w - bottomRadius, y + h);
      ctx.lineTo(x + bottomRadius, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - bottomRadius);
      ctx.lineTo(x, y + topRadius);
      ctx.quadraticCurveTo(x, y, x + topRadius, y);
      ctx.closePath();
      ctx.fill();
    }

    function drawMouth(ctx, expression, t, s, energy) {
      if (!["shocked", "surprised", "silly", "kiss"].includes(expression.id)) return;

      const x = 120 * s;
      const y = 172 * s;
      ctx.save();
      ctx.translate(x, y);
      ctx.strokeStyle = "rgba(107,244,239,.9)";
      ctx.fillStyle = "rgba(107,244,239,.9)";
      ctx.lineWidth = 2.4 * s;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.beginPath();

      switch (expression.id) {
        case "shocked":
          ctx.beginPath();
          ctx.ellipse(0, 0, 4 * s, 7 * s, 0, 0, Math.PI * 2);
          ctx.stroke();
          break;
        case "surprised":
          ctx.beginPath();
          ctx.arc(0, 0, 4 * s, 0, Math.PI * 2);
          ctx.fill();
          break;
        case "silly":
          ctx.moveTo(-7 * s, -1 * s);
          ctx.quadraticCurveTo(0, 3 * s, 7 * s, -1 * s);
          ctx.stroke();
          ctx.fillStyle = "#ff718c";
          ctx.beginPath();
          ctx.ellipse(3 * s, 3 * s, 2.5 * s, 4 * s, -.25, 0, Math.PI * 2);
          ctx.fill();
          break;
        case "kiss":
          ctx.strokeStyle = "rgba(255,113,140,.9)";
          ctx.moveTo(-5 * s, 0);
          ctx.quadraticCurveTo(0, -4 * s, 5 * s, 0);
          ctx.quadraticCurveTo(0, 4 * s, -5 * s, 0);
          ctx.stroke();
      }
      ctx.restore();
    }

    function drawHeart(ctx, x, y, size, alpha) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(size, size);
      ctx.globalAlpha = alpha;
      ctx.fillStyle = "#ff718c";
      ctx.beginPath();
      ctx.moveTo(0, 8);
      ctx.bezierCurveTo(-18, -5, -15, -20, -5, -20);
      ctx.bezierCurveTo(0, -20, 5, -16, 8, -11);
      ctx.bezierCurveTo(11, -16, 16, -20, 21, -20);
      ctx.bezierCurveTo(31, -20, 34, -5, 16, 8);
      ctx.lineTo(8, 15);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function drawSleepMarks(ctx, t, s) {
      const rise = (Math.sin(t * 1.15) + 1) * .5;
      ctx.save();
      ctx.fillStyle = `rgba(107,244,239,${.42 + rise * .42})`;
      ctx.font = `700 ${10 * s}px "SFMono-Regular", Consolas, monospace`;
      ctx.fillText("z", 163 * s, (87 - rise * 5) * s);
      ctx.font = `700 ${14 * s}px "SFMono-Regular", Consolas, monospace`;
      ctx.fillText("z", 177 * s, (75 - rise * 9) * s);
      ctx.font = `700 ${19 * s}px "SFMono-Regular", Consolas, monospace`;
      ctx.fillText("Z", 194 * s, (58 - rise * 13) * s);
      ctx.restore();
    }

    function drawThinkingMarks(ctx, t, s) {
      const phase = (Math.sin(t * 3.1) + 1) * .5;
      ctx.save();
      [0, 1, 2].forEach(index => {
        const alpha = .25 + Math.max(0, Math.sin(t * 3.1 - index * .75)) * .75;
        ctx.fillStyle = `rgba(107,244,239,${alpha})`;
        ctx.beginPath();
        ctx.arc((158 + index * 11) * s, 75 * s - phase * 3 * s, (2.8 + index * .3) * s, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.restore();
    }

    function drawComicAccents(ctx, expression, t, s) {
      ctx.save();
      ctx.strokeStyle = "rgba(107,244,239,.8)";
      ctx.fillStyle = "rgba(107,244,239,.86)";
      ctx.lineWidth = 2.2 * s;
      ctx.lineCap = "round";

      if (expression.id === "laughing") {
        const jump = Math.abs(Math.sin(t * 5.8)) * 4 * s;
        [[44, 74, 35, 66], [196, 74, 205, 66]].forEach(([x1, y1, x2, y2]) => {
          ctx.beginPath();
          ctx.moveTo(x1 * s, y1 * s - jump);
          ctx.lineTo(x2 * s, y2 * s - jump);
          ctx.stroke();
        });
      } else if (expression.id === "confused") {
        ctx.font = `800 ${22 * s}px "SFMono-Regular", Consolas, monospace`;
        ctx.fillText("?", 183 * s, (69 + Math.sin(t * 2.1) * 3) * s);
      } else if (expression.id === "shocked") {
        [[62, 54, 56, 38], [120, 42, 120, 24], [178, 54, 184, 38]].forEach(([x1, y1, x2, y2]) => {
          ctx.beginPath();
          ctx.moveTo(x1 * s, y1 * s);
          ctx.lineTo(x2 * s, y2 * s);
          ctx.stroke();
        });
      } else if (expression.id === "surprised") {
        const pulse = 1 + Math.sin(t * 4.1) * .18;
        ctx.translate(194 * s, 57 * s);
        ctx.scale(pulse, pulse);
        ctx.beginPath();
        ctx.moveTo(-8 * s, 0); ctx.lineTo(8 * s, 0);
        ctx.moveTo(0, -8 * s); ctx.lineTo(0, 8 * s);
        ctx.stroke();
      } else if (expression.id === "winking") {
        ctx.beginPath();
        ctx.moveTo(191 * s, 72 * s); ctx.lineTo(202 * s, 66 * s);
        ctx.moveTo(194 * s, 82 * s); ctx.lineTo(206 * s, 82 * s);
        ctx.stroke();
      } else if (expression.id === "listen") {
        ctx.lineWidth = 3 * s;
        for (let index = 0; index < 3; index++) {
          const phase = (t * 1.15 + index / 3) % 1;
          const radius = (72 + phase * 34) * s;
          ctx.globalAlpha = (1 - phase) * .9;
          ctx.beginPath();
          ctx.arc(120 * s, 120 * s, radius, -.5, .5);
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(120 * s, 120 * s, radius, Math.PI - .5, Math.PI + .5);
          ctx.stroke();
        }
      }
      ctx.restore();
    }

    function drawExpression(canvas, expression, time, scaleFactor, interactive) {
      const ctx = canvas.getContext("2d");
      const firmwareSpec = firmwareSpecs[expression.id];
      const motion = expressionMotion[expression.id];
      const w = canvas.width;
      const h = canvas.height;
      const s = w / 240;
      const energy = interactive ? state.energy / 100 : .58;
      const t = time / 1000;
      const expressionAge = interactive ? Math.max(0, time - state.expressionStart) : 1200;
      const entrance = interactive ? Math.min(1, expressionAge / 620) : 1;
      const entranceEase = 1 - Math.pow(1 - entrance, 3);
      const settle = interactive ? Math.sin(expressionAge / 42) * Math.exp(-expressionAge / 230) : 0;
      ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = "#020405";
      ctx.fillRect(0, 0, w, h);

      const glow = ctx.createRadialGradient(w * .5, h * .47, 0, w * .5, h * .47, w * .46);
      glow.addColorStop(0, "rgba(29, 78, 80, .16)");
      glow.addColorStop(1, "rgba(0, 0, 0, 0)");
      ctx.fillStyle = glow;
      ctx.fillRect(0, 0, w, h);

      let blink = 1;
      if (interactive && state.blinkStart) {
        const progress = (time - state.blinkStart) / 210;
        if (progress >= 1) state.blinkStart = 0;
        else blink = Math.max(.06, Math.abs(progress * 2 - 1));
      }
      if (expression.sleepy) blink *= .76 + Math.sin(t * .7) * .16;
      if (expression.wink) blink = 1;

      const bounce = (expression.bounce || 0) * Math.sin(t * 5.4) * 5 * energy;
      const shake = (expression.shake || 0) * Math.sin(t * 18) * 3 * energy;
      const pulse = expression.pulse ? 1 + Math.sin(t * 4.2) * expression.pulse * .08 : 1;
      let autoX = 0;
      let autoY = 0;
      if (interactive && state.autoGaze) {
        autoX = state.gazeTargetX;
        autoY = state.gazeTargetY;
      } else if (!interactive) {
        autoX = Math.sin(t * .55 + expressions.indexOf(expression)) * .1;
        autoY = Math.cos(t * .42 + expressions.indexOf(expression) * .7) * .05;
      }

      const eyeBaseW = firmwareSpec.width * pulse * (.72 + entranceEase * .28 + settle * .08);
      const eyeBaseH = firmwareSpec.height * blink * pulse * (.42 + entranceEase * .58 - settle * .18);
      const centers = [120 - firmwareSpec.gap / 2 - eyeBaseW / 2, 120 + firmwareSpec.gap / 2 + eyeBaseW / 2];

      centers.forEach((cx, index) => {
        let localH = eyeBaseH;
        let localW = eyeBaseW;
        let characterX = 0;
        let characterY = 0;
        let characterTilt = 0;
        const side = index === 0 ? -1 : 1;

        switch (expression.id) {
          case "neutral":
            localH *= 1 + Math.sin(t * 1.25) * .025 * energy;
            characterY = Math.sin(t * 1.25) * .8 * energy;
            break;
          case "happy":
            localW *= 1 + Math.sin(t * 3.1) * .035 * energy;
            characterY = Math.sin(t * 3.1) * 2.1 * energy;
            characterTilt = side * Math.sin(t * 3.1) * .018 * energy;
            break;
          case "laughing": {
            const laugh = Math.abs(Math.sin(t * 5.8));
            localW *= 1 + laugh * .07 * energy;
            localH *= 1 - laugh * .16 * energy;
            characterY = -laugh * 5.5 * energy;
            characterTilt = side * .035 * laugh * energy;
            break;
          }
          case "loving":
            localW *= 1 + Math.sin(t * 2.5) * .045 * energy;
            localH *= 1 + Math.sin(t * 2.5) * .065 * energy;
            characterX = -side * (2 + Math.sin(t * 2.5)) * energy;
            break;
          case "angry":
            characterX = -side * (2.4 + Math.sin(t * 7) * .8) * energy;
            localH *= 1 - Math.abs(Math.sin(t * 7)) * .04 * energy;
            break;
          case "sad":
          case "crying":
            characterY = (2.5 + Math.sin(t * 1.15 + index * .7) * 1.3) * energy;
            localH *= 1 - Math.sin(t * 1.15 + index * .7) * .035 * energy;
            break;
          case "confused":
            characterY = side * Math.sin(t * 1.8) * 3.2 * energy;
            characterTilt = side * Math.sin(t * 1.8) * .045 * energy;
            break;
          case "shocked":
            localH *= 1 + Math.sin(t * 3.8) * .045 * energy;
            characterY = -Math.abs(Math.sin(t * 3.8)) * 2 * energy;
            break;
          case "surprised":
            localW *= 1 + Math.sin(t * 3.3) * .035 * energy;
            localH *= 1 + Math.sin(t * 3.3) * .07 * energy;
            characterY = Math.sin(t * 3.3) * 2.8 * energy;
            break;
          case "sleepy":
          case "relaxed":
            characterY = Math.sin(t * .72 + index * .3) * 1.2 * energy;
            break;
          case "thinking":
            characterY = side * Math.sin(t * 1.1) * 1.1 * energy;
            characterTilt = side * .025;
            break;
          case "listen":
            localH *= 1 + Math.sin(t * 3.2) * .12 * energy;
            localW *= 1 - Math.sin(t * 3.2) * .04 * energy;
            characterX = Math.sin(t * 1.6) * 5 * energy;
            characterY = -Math.abs(Math.sin(t * 3.2)) * 2 * energy;
            break;
          case "embarrassed":
            characterY = Math.abs(Math.sin(t * 1.4)) * 1.8 * energy;
            characterX = side * Math.sin(t * 1.4) * .7 * energy;
            break;
          case "delicious":
            characterY = -Math.abs(Math.sin(t * 3.2)) * 2.5 * energy;
            characterTilt = side * Math.sin(t * 3.2) * .025 * energy;
            break;
        }
        const rhythm = Math.sin(t * motion.speed + index * .65);
        const lift = Math.cos(t * motion.speed + index * .65);
        localW *= 1 + rhythm * motion.width * energy;
        localH *= 1 + lift * motion.height * energy;
        characterX += rhythm * motion.x * energy;
        characterY += lift * motion.y * energy;
        characterTilt += side * rhythm * motion.tilt * energy;
        if (firmwareSpec.asymmetry) {
          const factor = index === 0 ? 1 + firmwareSpec.asymmetry : 1 - firmwareSpec.asymmetry;
          localH *= factor;
          localW *= 1 + (1 - factor) * .35;
        }
        if (expression.wink && index === 1) localH = 10;
        if (expression.goofy) localH *= index === 0 ? .72 : 1.16;

        let gazeX = ((expression.gazeX || 0) + autoX) * 12;
        let gazeY = ((expression.gazeY || 0) + autoY) * 11;
        if (expression.goofy) gazeX += index === 0 ? -7 : 7;
        const x = (cx - localW / 2 + shake + gazeX + characterX) * s;
        const y = (120 - localH / 2 + bounce + gazeY + characterY) * s;
        const tilt = (index === 0 ? firmwareSpec.tilt : -firmwareSpec.tilt) + characterTilt + (expression.goofy ? (index ? -.12 : .12) : 0);

        ctx.save();
        ctx.translate(cx * s, 120 * s);
        ctx.rotate(tilt);
        ctx.translate(-cx * s, -120 * s);

        ctx.shadowColor = "rgba(107, 244, 239, .65)";
        ctx.shadowBlur = 13 * s;
        drawEyeShape(ctx, x, y, localW * s, Math.max(5 * s, localH * s), index, expression, s);
        ctx.shadowBlur = 0;
        ctx.restore();
      });

      const eventWave = (Math.sin(t * 3.1) + 1) / 2;
      drawMouth(ctx, expression, t, s, energy);
      if (expression.hearts) {
        drawHeart(ctx, w * .5 - 7 * s, h * .75, .55 * s, .45 + eventWave * .45);
      }
      if (expression.tears) {
        ctx.fillStyle = `rgba(89,183,255,${.35 + eventWave * .55})`;
        [-1, 1].forEach(side => {
          ctx.beginPath();
          ctx.ellipse((120 + side * 49) * s, (163 + eventWave * 13) * s, 4 * s, 9 * s, 0, 0, Math.PI * 2);
          ctx.fill();
        });
      }
      if (expression.blush) {
        ctx.fillStyle = `rgba(255,101,122,${.14 + eventWave * .15})`;
        [-1, 1].forEach(side => {
          ctx.beginPath();
          ctx.ellipse((120 + side * 75) * s, 160 * s, 17 * s, 6 * s, 0, 0, Math.PI * 2);
          ctx.fill();
        });
      }
      if (expression.sparkle) {
        ctx.strokeStyle = `rgba(255,220,115,${.36 + eventWave * .6})`;
        ctx.lineWidth = 3 * s;
        [[47,57],[193,64],[184,183]].forEach(([sx,sy], i) => {
          const r = (5 + Math.sin(t * 4 + i) * 2) * s;
          ctx.beginPath();
          ctx.moveTo(sx * s - r, sy * s); ctx.lineTo(sx * s + r, sy * s);
          ctx.moveTo(sx * s, sy * s - r); ctx.lineTo(sx * s, sy * s + r);
          ctx.stroke();
        });
      }
      if (expression.id === "sleepy") drawSleepMarks(ctx, t, s);
      if (expression.id === "thinking") drawThinkingMarks(ctx, t, s);
      drawComicAccents(ctx, expression, t, s);

      ctx.strokeStyle = "rgba(255,255,255,.08)";
      ctx.lineWidth = 1 * s;
      ctx.beginPath();
      ctx.arc(w / 2, h / 2, w * .482, 0, Math.PI * 2);
      ctx.stroke();
    }

    function updateMotion(time) {
      if (state.autoGaze && time >= state.nextGaze) {
        state.gazeTargetX = (Math.random() - .5) * .5;
        state.gazeTargetY = (Math.random() - .5) * .28;
        state.nextGaze = time + 900 + Math.random() * 1900;
      }
      if (time >= state.nextBlink && !state.blinkStart) {
        state.blinkStart = time;
        const rate = state.blinkRate / 100;
        state.nextBlink = time + 950 + (1 - rate) * 3400 + Math.random() * 1200;
      }
    }

    function animate(time) {
      updateMotion(time);
      const selected = expressions.find(item => item.id === state.selected);
      drawExpression(mainCanvas, selected, time, 2, true);
      cardCanvases.forEach((canvas, id) => {
        drawExpression(canvas, expressions.find(item => item.id === id), time, 1, false);
      });
      requestAnimationFrame(animate);
    }

    const energyInput = document.getElementById("energy");
    const blinkInput = document.getElementById("blink-rate");
    energyInput.addEventListener("input", event => {
      state.energy = Number(event.target.value);
      document.getElementById("energy-value").textContent = event.target.value;
    });
    blinkInput.addEventListener("input", event => {
      state.blinkRate = Number(event.target.value);
      document.getElementById("blink-value").textContent = event.target.value;
    });

    firmwareInputs.forEach(input => {
      input.addEventListener("input", event => {
        const key = event.target.dataset.firmwareKey;
        const value = Number(event.target.value);
        firmwareSpecs[state.selected][key] = value;
        document.getElementById(`${event.target.id}-value`).textContent = value;
        state.expressionStart = performance.now();
      });
    });

    document.getElementById("export-firmware").addEventListener("click", () => {
      const floatValue = value => Number.isInteger(value) ? String(value) : `${value.toFixed(2).replace(/0+$/, "").replace(/\.$/, "")}f`;
      const rows = expressions.map(expression => {
        const spec = firmwareSpecs[expression.id];
        return `    {"${expression.id}", ${floatValue(spec.width)}, ${floatValue(spec.height)}, ${floatValue(spec.gap)}, ${floatValue(spec.tilt)}, ${floatValue(spec.asymmetry)}},`;
      });
      const source = `static const EyeSpec kEyeSpecs[] = {\n${rows.join("\n")}\n};\n`;
      const url = URL.createObjectURL(new Blob([source], { type: "text/plain;charset=utf-8" }));
      const link = document.createElement("a");
      link.href = url;
      link.download = "puppy_eye_specs.inc";
      link.click();
      URL.revokeObjectURL(url);
    });

    document.getElementById("auto-gaze").addEventListener("click", event => {
      state.autoGaze = !state.autoGaze;
      event.currentTarget.classList.toggle("active", state.autoGaze);
      event.currentTarget.setAttribute("aria-pressed", String(state.autoGaze));
      if (!state.autoGaze) {
        state.gazeTargetX = 0;
        state.gazeTargetY = 0;
      }
    });

    selectExpression("neutral");
    requestAnimationFrame(animate);
  </script>
</body>
</html>
